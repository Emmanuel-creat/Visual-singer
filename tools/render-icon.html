<!doctype html>
<!-- Rendu d'une icône de l'application en 256 px (fond transparent) pour générer les .ico :
     msedge --headless --screenshot --window-size=256,256 --default-background-color=00000000
            "http://localhost:8080/tools/render-icon.html#wave,ff4d3d"
     puis tools/make_icons.py assemble les tailles 16→256 dans assets/icons/*.ico. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #i, #i svg { width: 256px; height: 256px; display: block; }
</style>
</head>
<body>
<div id="i"></div>
<script type="module">
  import { icon } from '../js/icons.js';
  const [name, color] = location.hash.slice(1).split(',');
  document.getElementById('i').innerHTML = icon(name, `#${color}`);
</script>
</body>
</html>
